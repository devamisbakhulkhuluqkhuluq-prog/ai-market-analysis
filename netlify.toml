[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

# Aturan ini wajib untuk React agar routing berjalan lancar (jika nanti Anda tambah halaman)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200